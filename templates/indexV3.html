<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Mobile -->
    <meta

    >

    <meta name="theme-color" content="#FFFFFF">

    <title>TD — TodoDelivery</title>

    <style>
        /* =====================================================
           TD — TODO DELIVERY
           PERFORMANCE-FIRST SPLASH SCREEN
           ===================================================== */

        :root {
            --orange: #FF6B00;
            --orange-dark: #E85F00;
            --black: #151515;
            --gray: #6B6B6B;
            --white: #FFFFFF;
        }

        /* -----------------------------------------------------
           RESET
           ----------------------------------------------------- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--white);
            color: var(--black);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeSpeed;

            overflow: hidden;
        }

        /* -----------------------------------------------------
           SPLASH
           ----------------------------------------------------- */

        .splash {
            position: relative;

            width: 100%;
            height: 100dvh;
            min-height: 480px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: var(--white);

            overflow: hidden;
        }

        /* -----------------------------------------------------
           BRAND
           ----------------------------------------------------- */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            transform: translateY(12px);
            opacity: 0;

            animation:
                brand-in 550ms cubic-bezier(.2,.8,.2,1) 120ms forwards;
        }

        /* Logo */

        .logo {
            width: 92px;
            height: 92px;

            display: block;

            margin-bottom: 22px;
        }

        /* TD lettering */

        .logo-shape {
            fill: var(--orange);
        }

        /* Brand name */

        .brand-name {
            font-size: 28px;
            line-height: 1;

            font-weight: 750;
            letter-spacing: -1.4px;

            color: var(--black);
        }

        .brand-name span {
            color: var(--orange);
        }

        /* Slogan */

        .tagline {
            margin-top: 10px;

            font-size: 13px;
            line-height: 1;

            font-weight: 500;
            letter-spacing: .3px;

            color: var(--gray);

            opacity: 0;

            animation:
                tagline-in 450ms ease 420ms forwards;
        }

        /* -----------------------------------------------------
           ROUTE INDICATOR
           ----------------------------------------------------- */

        .route {
            position: absolute;

            bottom: 58px;
            left: 50%;

            width: 120px;
            height: 4px;

            transform: translateX(-50%);

            background: #EEEEEE;

            border-radius: 4px;

            overflow: hidden;

            opacity: 0;

            animation:
                route-in 350ms ease 650ms forwards;
        }

        .route-progress {
            width: 35%;
            height: 100%;

            background: var(--orange);

            border-radius: inherit;

            transform: translateX(-100%);

            animation:
                route-move 850ms cubic-bezier(.4,0,.2,1) 700ms forwards;
        }

        /* -----------------------------------------------------
           DECORATIVE ROUTE DOTS
           ----------------------------------------------------- */

        .route-dots {
            position: absolute;

            bottom: 72px;
            left: 50%;

            width: 154px;

            display: flex;
            justify-content: space-between;

            transform: translateX(-50%);

            pointer-events: none;
        }

        .dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #E5E5E5;

            opacity: 0;
        }

        .dot.active {
            background: var(--orange);

            animation:
                dot-pulse 700ms ease-in-out 700ms infinite alternate;
        }

        /* -----------------------------------------------------
           ANIMATIONS
           ----------------------------------------------------- */

        @keyframes brand-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes tagline-in {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes route-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes route-move {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(300%);
            }
        }

        @keyframes dot-pulse {
            from {
                opacity: .35;
            }

            to {
                opacity: 1;
            }
        }

        /* -----------------------------------------------------
           REDUCED MOTION
           ----------------------------------------------------- */

        @media (prefers-reduced-motion: reduce) {

            .brand,
            .tagline,
            .route {
                animation: none;
                opacity: 1;
                transform: none;
            }

            .route-progress {
                animation: none;
                transform: translateX(0);
            }

            .dot {
                opacity: 1;
            }
        }

        /* -----------------------------------------------------
           SMALL DEVICES
           ----------------------------------------------------- */

        @media (max-height: 560px) {

            .logo {
                width: 72px;
                height: 72px;

                margin-bottom: 16px;
            }

            .brand-name {
                font-size: 24px;
            }

            .tagline {
                margin-top: 8px;
            }

            .route {
                bottom: 30px;
            }

            .route-dots {
                bottom: 44px;
            }
        }
    </style>
</head>

<body>

</html>
