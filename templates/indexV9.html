<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12141A">
  <title>TD Pedidos</title>

  <style>
    /* ==========================================================================
       1. VARIABLES: Modo Oscuro de Alto Contraste (Legible bajo el sol)
       ========================================================================== */
    :root {
      --bg: #12141A;
      --card-bg: #1B1E26;
      --border: #2D323E;
      --border-focus: #FF7A1A;
      
      --primary: #FF7A1A;
      --primary-pressed: #D95400;
      
      --text-main: #FFFFFF;
      --text-body: #E8EBF2;
      --text-muted: #A2A9B8;
      
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-system);
      background-color: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 16px;
    }

    /* ==========================================================================
       2. SPLASH ULTRA EFICIENTE: Termina en 0.9s y se destruye en el DOM
       ========================================================================== */
    .splash-stage {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      will-change: opacity, transform;
      animation: splashExit 0.3s cubic-bezier(0.25, 1, 0.5, 1) 0.9s forwards;
    }

    @keyframes splashExit {
      to {
        opacity: 0;
        transform: translateY(-20px);
        visibility: hidden;
      }
    }

    .brand-hero {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      gap: 10px;
    }

    .brand-hero .accent {
      color: var(--primary);
    }

    .splash-sub {
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .splash-loader {
      margin-top: 24px;
      width: 22px;
      height: 22px;
      border: 2px solid #2D323E;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================================================
       3. FORMULARIO PRINCIPAL (Cero retraso, 100% Usabilidad)
       ========================================================================== */
    .main-wrapper {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(16px);
      animation: formEnter 0.35s cubic-bezier(0.25, 1, 0.5, 1) 0.85s forwards;
    }

    @keyframes formEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 122, 26, 0.12);
      border: 1px solid rgba(255, 122, 26, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 50%;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Inputs de alto contraste con 48px+ de área táctil */
    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
      background: #14161E;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      height: 50px;
      transition: border-color 0.15s ease;
    }

    .input-box:focus-within {
      border-color: var(--border-focus);
    }

    .input-field {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      padding: 0 14px;
      font-family: inherit;
    }

    .input-field::placeholder {
      color: #555B69;
    }

    .btn-peek {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0 14px;
      height: 100%;
      cursor: pointer;
    }

    /* Controles extra */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.82rem;
    }

    .remember-opt {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 40px;
    }

    .link-action {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }

    /* Botón directo */
    .btn-submit {
      width: 100%;
      height: 50px;
      background-color: var(--primary);
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .btn-submit:active {
      background-color: var(--primary-pressed);
      transform: scale(0.99);
    }

    .register-cta {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .register-cta a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen limpia: dura 0.9s, no tiene fondos pesados y se borra de la RAM -->
  <div class="splash-stage" id="splash">
    <div class="brand-hero">
      <span>TODO</span>
      <span class="accent">DELIVERY</span>
    </div>
    <p class="splash-sub">Pedidos &amp; Envíos</p>
    <div class="splash-loader"></div>
  </div>

  <!-- Vista Principal -->
  <main class="main-wrapper">
    <section class="auth-card">
      <header class="header">
        <div class="badge">
          <span class="badge-dot"></span>
          <span>PEDIDOS EN LÍNEA</span>
        </div>
        <h1 class="title">Iniciar Sesión</h1>
        <p class="subtitle">Ingresá para hacer tu pedido o pedir un envío</p>
      </header>

      <form id="loginForm" onsubmit="event.preventDefault(); alert('Iniciando...');">
        
        <!-- Identificador: inputmode numeric para teléfonos -->
        <div class="field-group">
          <label class="field-label" for="phone">Teléfono o Usuario</label>
          <div class="input-box">
            <input 
              type="text" 
              id="phone" 
              class="input-field" 
              placeholder="Ej: 3511234567" 
              inputmode="numeric" 
              autocomplete="username" 
              required
            >
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field-group">
          <label class="field-label" for="password">Contraseña</label>
          <div class="input-box">
            <input 
              type="password" 
              id="password" 
              class="input-field" 
              placeholder="Tu contraseña" 
              autocomplete="current-password" 
              required
            >
            <button type="button" id="togglePass" class="btn-peek">VER</button>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-opt">
            <input type="checkbox" style="accent-color: var(--primary); width: 16px; height: 16px;">
            <span>Recordarme</span>
          </label>
          <a href="#" class="link-action" onclick="alert('Recuperación por SMS o WhatsApp'); return false;">¿Olvidaste tu clave?</a>
        </div>

        <button type="submit" class="btn-submit">
          <span>INGRESAR</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>

        <div class="register-cta">
          <span>¿No tenés cuenta?</span>
          <a href="#" onclick="alert('Pantalla de Registro'); return false;">Crear cuenta</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById("splash");
      const togglePass = document.getElementById("togglePass");
      const passInput = document.getElementById("password");

      // Liberar memoria eliminando el elemento Splash del DOM al finalizar
      splash.addEventListener("animationend", () => {
        splash.remove();
      });

      // Alternar visualización de clave
      togglePass.addEventListener("click", () => {
        const isPass = passInput.type === "password";
        passInput.type = isPass ? "text" : "password";
        togglePass.textContent = isPass ? "OCULTAR" : "VER";
      });
    });
  </script>

</body>
</html>
