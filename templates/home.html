<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5A1F" />
  <title>Todo Delivery - Inicio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../scripts/tema_cliente.js"></script>
  <link rel="stylesheet" href="../styles/estilos_cliente.css" />
</head>

<body class="font-sans antialiased selection:bg-brand-accent/20 selection:text-brand-dark">

  <header id="appBar"></header>

  <div id="cargandoPagina" class="min-h-[70dvh] flex flex-col items-center justify-center gap-5" role="status" aria-live="polite">
    <div class="logo-cargando" aria-hidden="true">
      <img class="logo-cargando-base" src="../images/Logo_svg.svg" alt="" />
      <img class="logo-cargando-relleno" src="../images/Logo_svg.svg" alt="" />
    </div>
    <p class="text-center">
      <span class="block text-base font-extrabold text-brand-dark">Cargando</span>
      <span class="block text-sm font-semibold text-brand-textMuted">Inicio</span>
    </p>
  </div>

  <main id="contenidoPagina" class="hidden mx-auto w-full max-w-xl px-4 pt-5 espacio-nav flex flex-col gap-5">

    <!-- Totales -->
    <section class="bg-brand-surface border border-brand-border rounded-3xl p-4 shadow-card" aria-labelledby="tituloTotales">
      <h3 id="tituloTotales" class="text-base font-extrabold text-brand-dark">Tu historial con Todo Delivery</h3>
      <dl id="listaTotales" class="mt-3 grid grid-cols-2 gap-x-4 gap-y-3"></dl>
    </section>

    <!-- Saludo + selector de mes -->
    <section class="flex items-center justify-between gap-3" aria-label="Mes del resumen">
      <div class="min-w-0">
        <p id="saludoCliente" class="text-sm font-semibold text-brand-textMuted truncate"></p>
        <h2 class="text-xl font-black tracking-tight text-brand-dark">Tu resumen</h2>
      </div>
      <div class="flex items-center gap-1 shrink-0 rounded-full bg-brand-surface border border-brand-border shadow-card p-1">
        <button id="btnMesAnterior" type="button" aria-label="Mes anterior"
          class="w-9 h-9 rounded-full flex items-center justify-center text-brand-dark hover:bg-brand-surfaceLight disabled:opacity-30 disabled:hover:bg-transparent transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <span id="etiquetaMes" class="min-w-[104px] text-center text-sm font-extrabold text-brand-dark" aria-live="polite"></span>
        <button id="btnMesSiguiente" type="button" aria-label="Mes siguiente"
          class="w-9 h-9 rounded-full flex items-center justify-center text-brand-dark hover:bg-brand-surfaceLight disabled:opacity-30 disabled:hover:bg-transparent transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
        </button>
      </div>
    </section>

    <!-- Indicadores del mes -->
    <section id="gridResumen" class="grid grid-cols-2 gap-3" aria-label="Indicadores del mes" aria-busy="true"></section>

    <!-- Estado de los pedidos del mes -->
    <section class="bg-brand-surface border border-brand-border rounded-3xl p-4 shadow-card" aria-labelledby="tituloEstados">
      <h3 id="tituloEstados" class="text-base font-extrabold text-brand-dark">Cómo terminaron</h3>
      <p class="text-xs font-semibold text-brand-textMuted mt-0.5">Pedidos del mes según su estado</p>
      <div id="graficoEstados" class="mt-4"></div>
    </section>

    <!-- Últimos 6 meses -->
    <section class="bg-brand-surface border border-brand-border rounded-3xl p-4 shadow-card" aria-labelledby="tituloMeses">
      <h3 id="tituloMeses" class="text-base font-extrabold text-brand-dark">Últimos 6 meses</h3>
      <p class="text-xs font-semibold text-brand-textMuted mt-0.5">Tocá un mes para ver su resumen</p>
      <div id="graficoMeses" class="mt-4"></div>
    </section>

    <!-- Pedidos por día -->
    <section class="bg-brand-surface border border-brand-border rounded-3xl p-4 shadow-card" aria-labelledby="tituloPorDia">
      <h3 id="tituloPorDia" class="text-base font-extrabold text-brand-dark">Pedidos por día</h3>
      <p id="subtituloPorDia" class="text-xs font-semibold text-brand-textMuted mt-0.5">&nbsp;</p>
      <div id="graficoPorDia" class="mt-4"></div>
    </section>

    <!-- Hábitos (histórico) -->
    <section class="bg-brand-surface border border-brand-border rounded-3xl p-4 shadow-card" aria-labelledby="tituloDias">
      <h3 id="tituloDias" class="text-base font-extrabold text-brand-dark">Cuándo pedís</h3>
      <p class="text-xs font-semibold text-brand-textMuted mt-0.5">Por día de la semana · todo tu historial</p>
      <div id="graficoDias" class="mt-4"></div>
    </section>
  </main>

  <!-- Globo de datos al pasar el dedo o el mouse por una barra -->
  <div id="globoDatos" role="tooltip"
    class="hidden fixed z-[1200] pointer-events-none px-3 py-2 rounded-xl bg-brand-dark text-white text-xs font-bold shadow-lg max-w-[220px] whitespace-pre-line text-center"></div>

  <nav id="barraInferior"></nav>

  <script type="module">
    import { supabase } from '../scripts/conexion_supabase.js';
    import { requerirCliente, esPedidoEnCurso } from '../scripts/sesion_cliente.js';
    import { esBusquedaVencida } from '../scripts/script_asignacion.js';
    import {
      montarLayoutCliente, crearBotonAppBar, marcarSeguimientoActivo, mostrarErrorPagina, mostrarToast,
      formatearPesos, primerNombre, escaparHtml
    } from '../scripts/ui_cliente.js';

    const $ = (id) => document.getElementById(id);

    const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const MESES_CORTOS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const DIAS_SEMANA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const DIAS_CORTOS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

    // Un solo tono (el naranja de la marca): la barra destacada va llena y el resto en su versión suave
    const BARRA_FUERTE = 'bg-brand-accent';
    const BARRA_SUAVE = 'bg-brand-accent/25';
    const ALTURA_GRAFICO = 120; // px

    let clienteActual = null;
    let btnRefrescar = null;
    let pedidos = [];
    let mes = mesActual(); // { y, m } del resumen que se está viendo
    let cargando = false;
    let ultimaCarga = 0;

    iniciar();

    async function iniciar() {
      try {
        clienteActual = await requerirCliente();
        if (!clienteActual) return;

        const { acciones } = montarLayoutCliente(clienteActual, 'home', 'Inicio');
        btnRefrescar = crearBotonAppBar('refrescar', 'Actualizar resumen');
        btnRefrescar.addEventListener('click', () => cargarPedidos());
        acciones.append(btnRefrescar);

        const nombre = primerNombre(clienteActual.nombre_cliente);
        $('saludoCliente').textContent = nombre ? `Hola, ${nombre} 👋` : 'Hola 👋';

        $('btnMesAnterior').addEventListener('click', () => cambiarMes(-1));
        $('btnMesSiguiente').addEventListener('click', () => cambiarMes(1));
        $('graficoMeses').addEventListener('click', (e) => {
          const barra = e.target.closest('[data-mes]');
          if (!barra) return;
          const [y, m] = barra.dataset.mes.split('-').map(Number);
          mes = { y, m };
          renderTodo();
        });
        iniciarGlobo();

        pintarEsqueleto();
        await cargarPedidos();

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > 60000) {
            cargarPedidos({ silencioso: true });
          }
        });
      } catch (err) {
        console.error('Error al iniciar Inicio:', err);
        mostrarErrorPagina(err.message || 'Error de conexión con el servidor.');
      }
    }

    async function cargarPedidos({ silencioso = false } = {}) {
      if (cargando) return;
      cargando = true;
      btnRefrescar.disabled = true;
      btnRefrescar.querySelector('svg').classList.add('animate-spin');

      try {
        const { data, error } = await supabase
          .from('Pedidos')
          .select('id_pedido, fecha_pedido, estado_pedido, coste_pedido, tipo_paquete')
          .eq('id_cliente', clienteActual.id_cliente)
          .order('fecha_pedido', { ascending: false })
          .limit(1000);
        if (error) throw error;

        pedidos = (data || [])
          .map(p => ({ ...p, fecha: new Date(p.fecha_pedido) }))
          .filter(p => !Number.isNaN(p.fecha.getTime()));
        marcarSeguimientoActivo(pedidos.some(esPedidoEnCurso));
        ultimaCarga = Date.now();
        renderTodo();
      } catch (err) {
        console.error('Error al cargar el resumen:', err);
        if (silencioso) {
          mostrarToast('No pudimos actualizar tu resumen', { tipo: 'error' });
        } else {
          renderError();
        }
      } finally {
        cargando = false;
        btnRefrescar.disabled = false;
        btnRefrescar.querySelector('svg').classList.remove('animate-spin');
      }
    }

    // -------------------------------------------------------------------------
    // CÁLCULOS
    // -------------------------------------------------------------------------
    function mesActual() {
      const hoy = new Date();
      return { y: hoy.getFullYear(), m: hoy.getMonth() };
    }

    function desplazarMes({ y, m }, delta) {
      const total = y * 12 + m + delta;
      return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
    }

    const indiceMes = ({ y, m }) => y * 12 + m;
    const esDelMes = (p, { y, m }) => p.fecha.getFullYear() === y && p.fecha.getMonth() === m;
    const claveMes = ({ y, m }) => `${y}-${m}`;

    function primerMesConPedidos() {
      if (!pedidos.length) return mesActual();
      const masViejo = pedidos.reduce((a, p) => (p.fecha < a ? p.fecha : a), pedidos[0].fecha);
      return { y: masViejo.getFullYear(), m: masViejo.getMonth() };
    }

    function cambiarMes(delta) {
      const destino = desplazarMes(mes, delta);
      if (indiceMes(destino) > indiceMes(mesActual()) || indiceMes(destino) < indiceMes(primerMesConPedidos())) return;
      mes = destino;
      renderTodo();
    }

    const esEntregado = (p) => p.estado_pedido === 'entregado' || p.estado_pedido === 'rendido';
    // Una búsqueda que venció sin cadete cuenta como cancelada, igual que en "Mis pedidos"
    const esCancelado = (p) => p.estado_pedido === 'cancelado' || esBusquedaVencida(p);

    function estadisticasDelMes(delMes) {
      const entregados = delMes.filter(esEntregado);
      const cancelados = delMes.filter(esCancelado);
      const enCurso = delMes.filter(esPedidoEnCurso);
      const gasto = entregados.reduce((suma, p) => suma + (Number(p.coste_pedido) || 0), 0);
      const finalizados = entregados.length + cancelados.length;
      return {
        total: delMes.length,
        entregados: entregados.length,
        cancelados: cancelados.length,
        enCurso: enCurso.length,
        gasto,
        ticket: entregados.length ? gasto / entregados.length : null,
        tasaEntrega: finalizados ? entregados.length / finalizados : null
      };
    }

    // -------------------------------------------------------------------------
    // RENDER
    // -------------------------------------------------------------------------
    function renderTodo() {
      const hay = pedidos.length > 0;
      const delMes = pedidos.filter(p => esDelMes(p, mes));
      const delAnterior = pedidos.filter(p => esDelMes(p, desplazarMes(mes, -1)));
      const stats = estadisticasDelMes(delMes);
      const previas = estadisticasDelMes(delAnterior);

      $('etiquetaMes').textContent = `${MESES[mes.m]} ${mes.y}`;
      $('btnMesAnterior').disabled = indiceMes(mes) <= indiceMes(primerMesConPedidos());
      $('btnMesSiguiente').disabled = indiceMes(mes) >= indiceMes(mesActual());

      renderIndicadores(stats, previas);
      renderPorDia(delMes);
      renderMeses();
      renderEstados(stats);
      renderDiasSemana();
      renderTotales();

      $('gridResumen').setAttribute('aria-busy', 'false');
      if (!hay) {
        $('subtituloPorDia').textContent = 'Cuando hagas tu primer pedido, vas a ver acá tus números.';
      }
    }

    // ---- Indicadores -------------------------------------------------------
    function textoDelta(actual, anterior, formato) {
      const nombreAnterior = MESES_CORTOS[desplazarMes(mes, -1).m];
      if (anterior == null || actual == null) return `Sin datos en ${nombreAnterior}`;
      const diferencia = actual - anterior;
      if (diferencia === 0) return `Igual que en ${nombreAnterior}`;
      return `${diferencia > 0 ? '▲' : '▼'} ${formato(Math.abs(diferencia))} vs ${nombreAnterior}`;
    }

    function tarjetaIndicador({ etiqueta, valor, nota, destacada = false }) {
      return `
        <div class="${destacada ? 'col-span-2 ' : ''}rounded-3xl bg-brand-surface border border-brand-border shadow-card p-4">
          <p class="text-xs font-extrabold uppercase tracking-wider text-brand-textMuted">${escaparHtml(etiqueta)}</p>
          <p class="mt-1 ${destacada ? 'text-5xl' : 'text-2xl'} font-black tracking-tight text-brand-dark">${escaparHtml(valor)}</p>
          <p class="mt-1 text-xs font-semibold text-brand-textMuted">${escaparHtml(nota)}</p>
        </div>`;
    }

    function renderIndicadores(s, previas) {
      const pesosDiferencia = (n) => formatearPesos(n);
      const porcentaje = (v) => `${Math.round(v * 100)}%`;
      $('gridResumen').innerHTML = [
        tarjetaIndicador({
          etiqueta: 'Pedidos del mes',
          valor: String(s.total),
          nota: s.enCurso ? `${s.enCurso} en curso · ${textoDelta(s.total, previas.total, String)}` : textoDelta(s.total, previas.total, String),
          destacada: true
        }),
        tarjetaIndicador({
          etiqueta: 'Gastado',
          valor: formatearPesos(s.gasto),
          nota: textoDelta(s.gasto, previas.gasto, pesosDiferencia)
        }),
        tarjetaIndicador({
          etiqueta: 'Promedio por pedido',
          valor: s.ticket == null ? '—' : formatearPesos(s.ticket),
          nota: s.ticket == null ? 'Sin pedidos entregados' : textoDelta(s.ticket, previas.ticket, pesosDiferencia)
        }),
        tarjetaIndicador({
          etiqueta: 'Entregados',
          valor: String(s.entregados),
          nota: s.cancelados ? `${s.cancelados} cancelado${s.cancelados === 1 ? '' : 's'}` : 'Ninguno cancelado'
        }),
        tarjetaIndicador({
          etiqueta: 'Tasa de entrega',
          valor: s.tasaEntrega == null ? '—' : porcentaje(s.tasaEntrega),
          nota: s.tasaEntrega == null ? 'Sin pedidos finalizados' : textoDelta(s.tasaEntrega, previas.tasaEntrega, porcentaje)
        })
      ].join('');
    }

    // ---- Gráficos de columnas ----------------------------------------------
    /**
     * Columnas con base común: la altura es proporcional al valor máximo.
     * items: [{ valor, tip, etiqueta, fuerte, atributos }]
     */
    function columnas(items, { conValor = false, interactivo = false } = {}) {
      const maximo = Math.max(1, ...items.map(i => i.valor));
      const altoBarras = conValor ? ALTURA_GRAFICO - 18 : ALTURA_GRAFICO;
      return `
        <div class="flex items-end gap-[2px]" style="height: ${ALTURA_GRAFICO}px">
          ${items.map(i => {
            const alto = i.valor > 0 ? Math.max(4, Math.round((i.valor / maximo) * altoBarras)) : 2;
            const etiquetaAria = escaparHtml(i.tip.replace(/\n/g, ': '));
            const abre = interactivo ? 'button type="button"' : 'div';
            const cierra = interactivo ? 'button' : 'div';
            return `
              <${abre} data-tip="${escaparHtml(i.tip)}" ${i.atributos || ''} aria-label="${etiquetaAria}"
                class="flex-1 min-w-0 h-full flex flex-col items-center justify-end gap-0.5 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent rounded-md ${interactivo ? 'cursor-pointer' : ''}" ${interactivo ? '' : 'tabindex="0" role="img"'}>
                ${conValor ? `<span class="text-[11px] font-extrabold leading-none ${i.fuerte ? 'text-brand-dark' : 'text-brand-textMuted'}">${i.valor}</span>` : ''}
                <span class="w-full rounded-t-[4px] ${i.valor > 0 ? (i.fuerte ? BARRA_FUERTE : BARRA_SUAVE) : 'bg-brand-border'}" style="height: ${alto}px"></span>
              </${cierra}>`;
          }).join('')}
        </div>
        <div class="mt-1.5 flex gap-[2px] border-t border-brand-border pt-1.5">
          ${items.map(i => `<span class="flex-1 min-w-0 text-center text-[10px] font-bold leading-none ${i.fuerte ? 'text-brand-dark' : 'text-brand-textMuted'}">${escaparHtml(i.etiqueta)}</span>`).join('')}
        </div>`;
    }

    function renderPorDia(delMes) {
      const diasDelMes = new Date(mes.y, mes.m + 1, 0).getDate();
      const porDia = Array.from({ length: diasDelMes }, () => 0);
      delMes.forEach(p => { porDia[p.fecha.getDate() - 1]++; });

      const maximo = Math.max(...porDia);
      const marcados = new Set([1, 8, 15, 22, diasDelMes]); // el eje muestra solo algunos días
      const items = porDia.map((valor, i) => ({
        valor,
        tip: `${i + 1} de ${MESES[mes.m].toLowerCase()}\n${valor} pedido${valor === 1 ? '' : 's'}`,
        etiqueta: marcados.has(i + 1) ? String(i + 1) : '',
        fuerte: true
      }));

      if (delMes.length === 0) {
        $('subtituloPorDia').textContent = 'No hiciste pedidos este mes';
      } else {
        const diaPico = porDia.indexOf(maximo) + 1;
        $('subtituloPorDia').textContent = `Día con más pedidos: el ${diaPico} (${maximo})`;
      }
      $('graficoPorDia').innerHTML = columnas(items);
    }

    function renderMeses() {
      const items = Array.from({ length: 6 }, (_, i) => {
        const m = desplazarMes(mes, i - 5);
        const delMes = pedidos.filter(p => esDelMes(p, m));
        const s = estadisticasDelMes(delMes);
        const futuro = indiceMes(m) > indiceMes(mesActual());
        return {
          valor: s.total,
          tip: `${MESES[m.m]} ${m.y}\n${s.total} pedido${s.total === 1 ? '' : 's'} · ${formatearPesos(s.gasto)}`,
          etiqueta: MESES_CORTOS[m.m],
          fuerte: i === 5,
          atributos: `data-mes="${claveMes(m)}" ${futuro ? 'disabled' : ''}`
        };
      });
      $('graficoMeses').innerHTML = columnas(items, { conValor: true, interactivo: true });
    }

    // ---- Estado de los pedidos ----------------------------------------------
    function renderEstados(s) {
      const contenedor = $('graficoEstados');
      if (s.total === 0) {
        contenedor.innerHTML = vacio('Sin pedidos este mes');
        return;
      }

      // Estado = color + texto + cantidad (nunca solo color)
      const tramos = [
        { texto: 'Entregados', cantidad: s.entregados, color: 'bg-brand-success', icono: '✓' },
        { texto: 'En curso', cantidad: s.enCurso, color: 'bg-brand-warning', icono: '●' },
        { texto: 'Cancelados', cantidad: s.cancelados, color: 'bg-brand-danger', icono: '✕' }
      ];
      const otros = s.total - tramos.reduce((suma, t) => suma + t.cantidad, 0);
      if (otros > 0) tramos.push({ texto: 'Otros', cantidad: otros, color: 'bg-brand-textMuted', icono: '·' });

      contenedor.innerHTML = `
        <div class="flex h-4 gap-[2px] rounded-full overflow-hidden" role="img"
          aria-label="${escaparHtml(tramos.filter(t => t.cantidad).map(t => `${t.texto}: ${t.cantidad}`).join(', '))}">
          ${tramos.filter(t => t.cantidad).map(t => `
            <span data-tip="${escaparHtml(`${t.texto}\n${t.cantidad} de ${s.total}`)}" class="${t.color} h-full" style="flex: ${t.cantidad} 1 0"></span>`).join('')}
        </div>
        <ul class="mt-4 space-y-2">
          ${tramos.filter(t => t.cantidad).map(t => `
            <li class="flex items-center gap-2 text-sm">
              <span class="w-3 h-3 rounded-sm ${t.color} shrink-0" aria-hidden="true"></span>
              <span class="flex-1 font-semibold text-brand-dark"><span aria-hidden="true">${t.icono}</span> ${t.texto}</span>
              <span class="font-extrabold text-brand-dark">${t.cantidad}</span>
              <span class="w-10 text-right text-xs font-bold text-brand-textMuted">${Math.round((t.cantidad / s.total) * 100)}%</span>
            </li>`).join('')}
        </ul>`;
    }

    // ---- Barras horizontales (hábitos) --------------------------------------
    function barrasHorizontales(filas) {
      const maximo = Math.max(1, ...filas.map(f => f.valor));
      return `
        <ul class="space-y-2">
          ${filas.map(f => `
            <li class="flex items-center gap-3" data-tip="${escaparHtml(f.tip)}" tabindex="0" aria-label="${escaparHtml(f.tip.replace(/\n/g, ': '))}">
              <span class="w-[72px] shrink-0 text-xs font-bold truncate ${f.fuerte ? 'text-brand-dark' : 'text-brand-textMuted'}">${f.etiqueta}</span>
              <span class="flex-1 h-3 rounded-r-[4px] rounded-l-none">
                <span class="block h-full rounded-r-[4px] ${f.valor > 0 ? (f.fuerte ? BARRA_FUERTE : BARRA_SUAVE) : 'bg-brand-border'}"
                  style="width: ${f.valor > 0 ? Math.max(3, (f.valor / maximo) * 100) : 1}%"></span>
              </span>
              <span class="w-7 text-right text-xs font-extrabold text-brand-dark">${f.valor}</span>
            </li>`).join('')}
        </ul>`;
    }

    function renderDiasSemana() {
      const contenedor = $('graficoDias');
      if (!pedidos.length) {
        contenedor.innerHTML = vacio('Todavía no hay pedidos para analizar');
        return;
      }
      const porDia = Array.from({ length: 7 }, () => 0);
      pedidos.forEach(p => { porDia[(p.fecha.getDay() + 6) % 7]++; }); // lunes primero
      const maximo = Math.max(...porDia);
      contenedor.innerHTML = barrasHorizontales(porDia.map((valor, i) => ({
        etiqueta: DIAS_CORTOS[i],
        valor,
        fuerte: valor === maximo,
        tip: `${DIAS_SEMANA[i]}\n${valor} pedido${valor === 1 ? '' : 's'}`
      })));
    }

    // ---- Totales ----------------------------------------------------------
    function renderTotales() {
      const s = estadisticasDelMes(pedidos);
      const primero = pedidos.length ? primerMesConPedidos() : null;
      const mesesActivo = primero ? indiceMes(mesActual()) - indiceMes(primero) + 1 : 0;
      const dato = (etiqueta, valor) => `
        <div>
          <dt class="text-xs font-extrabold uppercase tracking-wider text-brand-textMuted">${etiqueta}</dt>
          <dd class="mt-0.5 text-lg font-black text-brand-dark">${escaparHtml(valor)}</dd>
        </div>`;
      $('listaTotales').innerHTML = [
        dato('Pedidos totales', String(s.total)),
        dato('Gasto total', formatearPesos(s.gasto)),
        dato('Pedidos por mes', mesesActivo ? (s.total / mesesActivo).toLocaleString('es-AR', { maximumFractionDigits: 1 }) : '—'),
        dato('Primer pedido', primero ? `${MESES_CORTOS[primero.m]} ${primero.y}` : '—')
      ].join('');
    }

    // ---- Estados auxiliares -------------------------------------------------
    function vacio(texto) {
      return `<p class="py-6 text-center text-sm font-semibold text-brand-textMuted">${escaparHtml(texto)}</p>`;
    }

    function pintarEsqueleto() {
      $('gridResumen').innerHTML = `
        <div class="skeleton col-span-2 h-[116px] rounded-3xl"></div>
        <div class="skeleton h-[96px] rounded-3xl"></div>
        <div class="skeleton h-[96px] rounded-3xl"></div>`;
      ['graficoPorDia', 'graficoMeses', 'graficoEstados', 'graficoDias'].forEach(id => {
        $(id).innerHTML = '<div class="skeleton h-[120px] rounded-2xl"></div>';
      });
      $('etiquetaMes').textContent = `${MESES[mes.m]} ${mes.y}`;
    }

    function renderError() {
      $('gridResumen').innerHTML = `
        <div class="col-span-2 rounded-3xl bg-brand-surface border border-brand-border shadow-card px-6 py-8 text-center">
          <span class="text-4xl" aria-hidden="true">⚠️</span>
          <p class="mt-3 font-bold">No pudimos cargar tu resumen</p>
          <p class="mt-1 text-sm text-brand-textMuted">Revisá tu conexión e intentá de nuevo.</p>
          <button type="button" data-reintentar
            class="mt-4 h-11 px-5 rounded-xl bg-brand-surfaceLight border border-brand-border font-bold text-sm">Reintentar</button>
        </div>`;
      $('gridResumen').setAttribute('aria-busy', 'false');
      $('gridResumen').querySelector('[data-reintentar]').addEventListener('click', () => cargarPedidos());
    }

    // -------------------------------------------------------------------------
    // GLOBO DE DATOS (mouse, teclado y toque)
    // -------------------------------------------------------------------------
    function iniciarGlobo() {
      const globo = $('globoDatos');
      let elementoActual = null;
      let temporizador = null;

      const mostrar = (el) => {
        clearTimeout(temporizador);
        elementoActual = el;
        globo.textContent = el.dataset.tip;
        globo.classList.remove('hidden');

        const caja = el.getBoundingClientRect();
        const ancho = globo.offsetWidth;
        const izquierda = Math.min(Math.max(8, caja.left + caja.width / 2 - ancho / 2), window.innerWidth - ancho - 8);
        const arriba = Math.max(8, caja.top - globo.offsetHeight - 8);
        globo.style.left = `${izquierda}px`;
        globo.style.top = `${arriba}px`;
      };
      const ocultar = () => {
        elementoActual = null;
        globo.classList.add('hidden');
      };

      document.addEventListener('pointerover', (e) => {
        const el = e.target.closest('[data-tip]');
        if (el && el !== elementoActual) mostrar(el);
        else if (!el && elementoActual) ocultar();
      });
      document.addEventListener('pointerdown', (e) => {
        const el = e.target.closest('[data-tip]');
        if (el) {
          mostrar(el);
          // En pantallas táctiles no hay "salir con el mouse": se oculta solo
          if (e.pointerType !== 'mouse') temporizador = setTimeout(ocultar, 2500);
        } else {
          ocultar();
        }
      });
      document.addEventListener('focusin', (e) => {
        const el = e.target.closest('[data-tip]');
        if (el) mostrar(el);
      });
      document.addEventListener('focusout', ocultar);
      window.addEventListener('scroll', ocultar, { passive: true });
    }
  </script>
</body>
