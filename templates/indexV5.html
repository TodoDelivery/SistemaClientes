<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Todo Delivery</title>
<style>
  :root{
    --orange:#FF5A1F;
    --orange-deep:#E14A0F;
    --orange-soft:#FFB088;
    --white:#FFFFFF;
    --ink:#1A1A1A;
    --grey-bg:#F5F5F5;
    --grey-text:#8A8A8A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--white);overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    position:relative;
    height:100vh;
  }

  /* ================= LOGIN (capa de fondo, ya renderizada) ================= */
  .login{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:32px 28px;
  }
  .login-logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:36px;
    opacity:0;
    transform:translateY(14px);
  }
  .login-logo svg{width:28px;height:28px;flex-shrink:0;}
  .login-logo span{font-size:16px;font-weight:700;color:var(--ink);}

  .login-title{
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.02em;
    opacity:0;
    transform:translateY(14px);
  }
  .login-sub{
    margin-top:6px;
    font-size:14px;
    color:var(--grey-text);
    opacity:0;
    transform:translateY(14px);
  }

  .field{
    margin-top:22px;
    opacity:0;
    transform:translateY(14px);
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    height:52px;
    border:none;
    border-radius:10px;
    background:var(--grey-bg);
    padding:0 16px;
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .field input:focus{outline:2px solid var(--orange);outline-offset:1px;}

  .forgot{
    margin-top:12px;
    font-size:13px;
    font-weight:600;
    color:var(--orange-deep);
    align-self:flex-end;
    opacity:0;
    transform:translateY(14px);
  }

  .btn-login{
    margin-top:28px;
    width:100%;
    height:52px;
    border:none;
    border-radius:10px;
    background:var(--orange);
    color:var(--white);
    font-size:16px;
    font-weight:700;
    opacity:0;
    transform:translateY(14px);
  }
  .btn-login:active{background:var(--orange-deep);}

  .signup{
    margin-top:20px;
    text-align:center;
    font-size:13px;
    color:var(--grey-text);
    opacity:0;
    transform:translateY(14px);
  }
  .signup b{color:var(--ink);}

  /* Cascada de entrada del login, disparada por clase .go */
  .go .login-logo{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .05s forwards;}
  .go .login-title{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .12s forwards;}
  .go .login-sub{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .18s forwards;}
  .go .field:nth-of-type(1){animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .26s forwards;}
  .go .field:nth-of-type(2){animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .34s forwards;}
  .go .forgot{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .40s forwards;}
  .go .btn-login{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .48s forwards;}
  .go .signup{animation:riseIn .45s cubic-bezier(.2,.8,.2,1) .56s forwards;}

  @keyframes riseIn{to{opacity:1;transform:translateY(0);}}

  /* ================= SPLASH (cortina que se desliza) ================= */
  .curtain{
    position:absolute;
    inset:0;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    will-change:transform;
    transform:translateY(0);
    transition:transform .65s cubic-bezier(.65,0,.35,1);
    z-index:5;
  }
  .curtain.lift{transform:translateY(-100%);}

  .mark{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* Dos fragmentos que convergen para formar el ícono */
  .frag-a{
    transform:translate(-46px,-46px);
    opacity:0;
    animation:convergeA .5s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  .frag-b{
    transform:translate(46px,46px);
    opacity:0;
    animation:convergeB .5s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  .dot{
    transform:scale(0);
    opacity:0;
    transform-origin:center;
    animation:pop .3s cubic-bezier(.34,1.56,.64,1) .55s forwards;
  }
  @keyframes convergeA{to{transform:translate(0,0);opacity:1;}}
  @keyframes convergeB{to{transform:translate(0,0);opacity:1;}}
  @keyframes pop{to{transform:scale(1);opacity:1;}}

  .wordmark{
    margin-top:18px;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--white);
    opacity:0;
    transform:translateY(8px);
    animation:riseIn .4s cubic-bezier(.2,.8,.2,1) .68s forwards;
  }
  .tagline{
    margin-top:6px;
    font-size:14px;
    font-weight:500;
    color:var(--orange-soft);
    opacity:0;
    animation:riseIn .4s cubic-bezier(.2,.8,.2,1) .8s forwards;
  }

  .progress-track{
    margin-top:44px;
    width:120px;
    height:3px;
    background:rgba(255,255,255,0.28);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    width:100%;height:100%;
    background:var(--white);
    transform:scaleX(0);
    transform-origin:left;
    animation:progress .8s cubic-bezier(.4,0,.2,1) .95s forwards;
  }
  @keyframes progress{to{transform:scaleX(1);}}

  @media (prefers-reduced-motion: reduce){
    .frag-a,.frag-b,.dot,.wordmark,.tagline,.progress-fill,
    .login-logo,.login-title,.login-sub,.field,.forgot,.btn-login,.signup{
      animation:none !important;opacity:1 !important;transform:none !important;
    }
    .curtain{display:none;}
  }
</style>
</head>
<body>

  <!-- LOGIN: ya está montado detrás de la cortina, listo para desvelarse -->
  <div class="login" id="login">
    <div class="login-logo">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 8 L8 16 L16 16" fill="none" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 32 L32 24 L24 24" fill="none" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="20" r="3" fill="#FF5A1F"/>
      </svg>
      <span>Todo Delivery</span>
    </div>

    <div class="login-title">Bienvenido de nuevo</div>
    <div class="login-sub">Ingresa para seguir tus envíos.</div>

    <div class="field">
      <label for="phone">Teléfono o correo</label>
      <input id="phone" type="text" inputmode="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password">
    </div>

    <div class="forgot">¿Olvidaste tu contraseña?</div>

    <button class="btn-login" type="button">Iniciar sesión</button>

    <div class="signup">¿Aún no tienes cuenta? <b>Regístrate</b></div>
  </div>

  <!-- SPLASH: cortina que se levanta y desvela el login -->
  <div class="curtain" id="curtain">
    <div class="mark">
      <svg width="88" height="88" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
        <g class="frag-a">
          <path d="M20 34 L20 20 L34 20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="frag-b">
          <path d="M68 54 L68 68 L54 68" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <circle class="dot" cx="44" cy="44" r="7" fill="#FFFFFF"/>
      </svg>
      <div class="wordmark">Todo Delivery</div>
      <div class="tagline">Todo llega. A tiempo.</div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>
  </div>

  <script>
    // La cortina se levanta y el login se desvela en cascada.
    // Tiempos ajustados para que la animación del logo termine antes de levantar cortina.
    setTimeout(function(){
      document.getElementById('curtain').classList.add('lift');
      document.getElementById('login').classList.add('go');
    }, 1900);
  </script>

</body>
</html>
