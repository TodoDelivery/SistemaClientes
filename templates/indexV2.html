<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>TodoDelivery</title>

  <style>
    :root {
      --td-orange: #E65100;
      --td-dark: #111827;
      --td-gray: #6B7280;
      --td-white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--td-white);
      color: var(--td-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeSpeed;
      overflow: hidden;
    }

    /* =========================
       PANTALLA DE CARGA
       ========================= */

    .splash {
      position: relative;

      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #FFFFFF;

      overflow: hidden;

      /*
       * La transición completa se aplica
       * únicamente mediante opacity y transform.
       */
      opacity: 1;
      transform: translateZ(0);

      transition:
        opacity 500ms ease,
        transform 500ms cubic-bezier(.22, .61, .36, 1);
    }


    /* =========================
       MARCA
       ========================= */

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateZ(0);

      transition:
        opacity 450ms ease,
        transform 550ms cubic-bezier(.22, .61, .36, 1);
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
      width: 86px;
      height: 86px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--td-orange);
      color: #FFFFFF;

      border-radius: 22px;

      font-size: 38px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;

      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.10);

      transform: translateZ(0);

      transition:
        opacity 400ms ease,
        transform 500ms cubic-bezier(.22, .61, .36, 1);
    }


    /* =========================
       NOMBRE
       ========================= */

    .name {
      margin-top: 22px;

      font-size: 27px;
      font-weight: 750;
      letter-spacing: -0.8px;

      color: var(--td-dark);

      transition:
        opacity 400ms ease,
        transform 500ms cubic-bezier(.22, .61, .36, 1);
    }

    .name strong {
      color: var(--td-orange);
      font-weight: 800;
    }


    /* =========================
       DESCRIPCIÓN
       ========================= */

    .tagline {
      margin-top: 7px;

      font-size: 14px;
      font-weight: 450;

      color: var(--td-gray);

      transition:
        opacity 400ms ease,
        transform 500ms cubic-bezier(.22, .61, .36, 1);
    }


    /* =========================
       INDICADOR DE CARGA
       ========================= */

    .loading {
      position: absolute;
      bottom: 42px;

      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--td-gray);

      font-size: 12px;
      font-weight: 500;

      transition:
        opacity 350ms ease,
        transform 450ms cubic-bezier(.22, .61, .36, 1);
    }


    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--td-orange);

      transform: translateZ(0);

      animation: pulse 900ms ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 120ms;
      opacity: .65;
    }

    .dot:nth-child(3) {
      animation-delay: 240ms;
      opacity: .4;
    }


    /* =========================
       ANIMACIÓN DE ENTRADA
       ========================= */

    .brand {
      animation: brand-in 500ms cubic-bezier(.22, .61, .36, 1) both;
    }

    @keyframes brand-in {

      from {
        opacity: 0;
        transform: translateY(10px) translateZ(0);
      }

      to {
        opacity: 1;
        transform: translateY(0) translateZ(0);
      }

    }


    /* =========================
       ANIMACIÓN DE PUNTOS
       ========================= */

    @keyframes pulse {

      0%,
      100% {
        opacity: .35;
        transform: scale(.85) translateZ(0);
      }

      50% {
        opacity: 1;
        transform: scale(1) translateZ(0);
      }

    }


    /* =========================
       TRANSICIÓN DE SALIDA
       ========================= */

    /*
     * Se activa agregando .exit
     */

    .splash.exit {
      opacity: 0;
      transform: scale(1.015) translateZ(0);
    }

    .splash.exit .brand {
      opacity: 0;
      transform: translateY(-10px) scale(.985) translateZ(0);
    }

    .splash.exit .logo {
      opacity: 0;
      transform: scale(.94) translateZ(0);
    }

    .splash.exit .name {
      opacity: 0;
      transform: translateY(-5px) translateZ(0);
    }

    .splash.exit .tagline {
      opacity: 0;
      transform: translateY(-3px) translateZ(0);
    }

    .splash.exit .loading {
      opacity: 0;
      transform: translateY(5px) translateZ(0);
    }


    /* =========================
       ACCESIBILIDAD
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }

    }

  </style>
</head>


<body>

  <main
    class="splash"
    id="splash"
    aria-label="Cargando TodoDelivery"
  >

    <section class="brand">

      <div
        class="logo"
        aria-label="TodoDelivery"
      >
        TD
      </div>

      <h1 class="name">
        Todo<strong>Delivery</strong>
      </h1>

      <p class="tagline">
        Todo lo que necesitás, cerca tuyo.
      </p>

    </section>


    <div
      class="loading"
      aria-label="Cargando"
    >
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </main>


  <script>

    /*
     * ==========================================
     * CONFIGURACIÓN
     * ==========================================
     */

    const NEXT_PAGE = "Registro.html";

    /*
     * Tiempo que permanece visible la pantalla
     * antes de comenzar la transición.
     *
     * 1800 ms = 1.8 segundos
     */
    const DISPLAY_TIME = 1800;


    /*
     * ==========================================
     * INICIO
     * ==========================================
     */

    const splash = document.getElementById("splash");


    /*
     * Esperamos unos instantes y comenzamos
     * la transición de salida.
     */

    window.setTimeout(() => {

      splash.classList.add("exit");


      /*
       * Esperamos a que termine la animación
       * antes de cambiar de página.
       *
       * Esto evita que el cambio sea brusco.
       */

      window.setTimeout(() => {

        window.location.replace(NEXT_PAGE);

      }, 550);

    }, DISPLAY_TIME);

  </script>

</body>
</html>
