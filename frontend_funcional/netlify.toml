# Sitio estático: no hay build, se publica la raíz del repo tal cual.
[build]
  publish = "."
  command = ""

# Archivos del repo que no son parte de la app: no se sirven
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

# Los .js no llevan hash en el nombre: sin esto el navegador puede mezclar un HTML nuevo con un
# módulo viejo cacheado (ej: importa una función que la versión cacheada no exporta) y la página no carga.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
