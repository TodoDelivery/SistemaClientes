<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5A1F" />
  <title>Todo Delivery - Mis pedidos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="../scripts/tema_cliente.js"></script>
  <link rel="stylesheet" href="../styles/estilos_cliente.css" />
</head>

<body class="font-sans antialiased selection:bg-brand-accent/20 selection:text-brand-dark">

  <header id="appBar"></header>

  <div id="cargandoPagina" class="min-h-[70dvh] flex flex-col items-center justify-center gap-3 text-sm font-semibold text-brand-textMuted">
    <svg class="animate-spin h-6 w-6 text-brand-accent" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
    Cargando...
  </div>

  <main id="contenidoPagina" class="hidden mx-auto w-full max-w-xl px-4 pt-5 espacio-nav flex flex-col gap-6">

    <!-- Saludo + acción principal -->
    <section aria-label="Pedir un envío">
      <p id="saludoCliente" class="text-sm font-semibold text-brand-textMuted"></p>
      <a href="crear_pedido.html"
        class="mt-2 flex items-center gap-4 p-4 rounded-3xl bg-gradient-to-br from-brand-accent to-brand-accentHover text-white shadow-btn hover:shadow-btn-hover active:scale-[0.99] transition-all">
        <span class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-2xl shrink-0" aria-hidden="true">🛵</span>
        <span class="flex-1 min-w-0">
          <span class="block text-lg font-black leading-tight">Pedir un envío</span>
          <span class="block text-sm font-medium opacity-90">Cotizá al instante y seguilo en vivo</span>
        </span>
        <svg class="w-6 h-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </a>
    </section>

    <!-- Teléfono sin cargar -->
    <a id="avisoTelefono" href="configuracion.html#telefono"
      class="hidden flex items-center gap-3 -mt-2 px-4 py-3 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 shadow-sm">
      <span class="text-xl" aria-hidden="true">📞</span>
      <span class="flex-1 min-w-0 text-sm font-semibold text-amber-900">Cargá tu teléfono para que el cadete pueda llamarte</span>
      <span class="text-sm font-bold text-amber-700 shrink-0">Completar</span>
    </a>

    <!-- Pedidos en curso -->
    <section id="seccionEnCurso" class="hidden space-y-3" aria-labelledby="tituloEnCurso">
      <h2 id="tituloEnCurso" class="text-xs font-extrabold uppercase tracking-wider text-brand-textMuted">En curso</h2>
      <div id="listaEnCurso" class="space-y-3"></div>
    </section>

    <!-- Historial -->
    <section class="space-y-3" aria-labelledby="tituloHistorial">
      <h2 id="tituloHistorial" class="text-xs font-extrabold uppercase tracking-wider text-brand-textMuted">Historial</h2>
      <div id="historialList" class="bg-brand-surface border border-brand-border rounded-3xl overflow-hidden divide-y divide-brand-border shadow-card" aria-busy="true"></div>
    </section>
  </main>

  <nav id="barraInferior"></nav>

  <script type="module">
    import { supabase } from '../scripts/conexion_supabase.js';
    import { ESTADOS_BUSQUEDA } from '../scripts/script_asignacion.js';
    import { PAGINAS, requerirCliente, esPedidoEnCurso, telefonoPendiente } from '../scripts/sesion_cliente.js';
    import {
      montarLayoutCliente, crearBotonAppBar, marcarSeguimientoActivo, mostrarErrorPagina, mostrarToast,
      estadoUI, emojiPaquete, formatearPesos, formatearFechaPedido, primerNombre, escaparHtml, icono
    } from '../scripts/ui_cliente.js';

    const FILA_SKELETON = `
      <div class="flex items-center gap-3 px-4 py-3.5" aria-hidden="true">
        <span class="skeleton w-11 h-11 rounded-2xl shrink-0"></span>
        <span class="flex-1 space-y-2">
          <span class="skeleton block h-3.5 w-2/3 rounded"></span>
          <span class="skeleton block h-3 w-1/3 rounded"></span>
        </span>
        <span class="skeleton w-14 h-4 rounded"></span>
      </div>`;

    let clienteActual = null;
    let btnRefrescar = null;
    let cargando = false;
    let ultimaCarga = 0;

    iniciar();

    async function iniciar() {
      try {
        clienteActual = await requerirCliente();
        if (!clienteActual) return;

        const { acciones } = montarLayoutCliente(clienteActual, 'historial', 'Mis pedidos');
        btnRefrescar = crearBotonAppBar('refrescar', 'Actualizar pedidos');
        btnRefrescar.addEventListener('click', () => cargarPedidos());
        acciones.append(btnRefrescar);

        const nombre = primerNombre(clienteActual.nombre_cliente);
        document.getElementById('saludoCliente').textContent = nombre ? `Hola, ${nombre} 👋` : 'Hola 👋';
        document.getElementById('avisoTelefono').classList.toggle('hidden', !telefonoPendiente(clienteActual.telefono_cliente));

        await cargarPedidos();

        // Al volver a la pestaña se actualiza solo (ej: el cadete entregó mientras tanto)
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && Date.now() - ultimaCarga > 30000) {
            cargarPedidos({ silencioso: true });
          }
        });
      } catch (err) {
        console.error('Error al iniciar Mis pedidos:', err);
        mostrarErrorPagina(err.message || 'Error de conexión con el servidor.');
      }
    }

    async function cargarPedidos({ silencioso = false } = {}) {
      if (cargando) return;
      cargando = true;

      const lista = document.getElementById('historialList');
      btnRefrescar.disabled = true;
      btnRefrescar.querySelector('svg').classList.add('animate-spin');
      if (!silencioso) {
        lista.setAttribute('aria-busy', 'true');
        lista.innerHTML = FILA_SKELETON.repeat(3);
      }

      try {
        const { data: pedidos, error } = await supabase
          .from('Pedidos')
          .select('*')
          .eq('id_cliente', clienteActual.id_cliente)
          .order('fecha_pedido', { ascending: false })
          .limit(25);

        if (error) throw error;

        const todos = pedidos || [];
        const enCurso = todos.filter(esPedidoEnCurso);
        const anteriores = todos.filter(p => !esPedidoEnCurso(p));

        renderEnCurso(enCurso);
        renderHistorial(anteriores, todos.length === 0);
        marcarSeguimientoActivo(enCurso.length > 0);
        ultimaCarga = Date.now();
      } catch (err) {
        console.error('Error al cargar pedidos:', err);
        if (silencioso) {
          mostrarToast('No pudimos actualizar tus pedidos', { tipo: 'error' });
        } else {
          renderErrorHistorial();
        }
      } finally {
        cargando = false;
        lista.setAttribute('aria-busy', 'false');
        btnRefrescar.disabled = false;
        btnRefrescar.querySelector('svg').classList.remove('animate-spin');
      }
    }

    function renderEnCurso(pedidos) {
      document.getElementById('seccionEnCurso').classList.toggle('hidden', pedidos.length === 0);
      document.getElementById('listaEnCurso').innerHTML = pedidos.map(p => {
        const buscando = ESTADOS_BUSQUEDA.includes(p.estado_pedido);
        const estado = estadoUI(p);
        return `
          <a href="${urlPedido(p.id_pedido)}"
            class="block p-4 rounded-3xl bg-brand-surface border ${buscando ? 'border-amber-300' : 'border-brand-accent/40'} shadow-card hover:shadow-card-hover active:scale-[0.99] transition-all">
            <div class="flex items-center gap-3">
              <span class="w-12 h-12 rounded-2xl ${buscando ? 'bg-amber-50 text-amber-600' : 'bg-orange-50 text-brand-accent'} flex items-center justify-center text-2xl shrink-0" aria-hidden="true">
                ${buscando ? '🔍' : '🛵'}
              </span>
              <span class="flex-1 min-w-0">
                <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-bold ${estado.clases}">${escaparHtml(estado.texto)}</span>
                <span class="mt-1 block font-bold text-brand-dark truncate">${escaparHtml(p.inform_pedido || 'Envío')}</span>
                <span class="block text-xs text-brand-textMuted">#${escaparHtml(p.id_pedido)} · ${formatearFechaPedido(p.fecha_pedido)}</span>
              </span>
            </div>
            <div class="mt-3 pt-3 border-t border-brand-border flex items-center justify-between gap-2 text-sm font-bold ${buscando ? 'text-amber-700' : 'text-brand-accent'}">
              <span>${buscando ? 'Continuar la búsqueda de cadete' : 'Seguir en vivo'}</span>
              ${icono('flecha', 'w-5 h-5')}
            </div>
          </a>`;
      }).join('');
    }

    function renderHistorial(pedidos, sinPedidos) {
      const lista = document.getElementById('historialList');

      if (pedidos.length === 0) {
        lista.innerHTML = `
          <div class="px-6 py-10 text-center">
            <span class="text-4xl" aria-hidden="true">📦</span>
            <p class="mt-3 font-bold text-brand-dark">${sinPedidos ? 'Todavía no hiciste pedidos' : 'Sin pedidos finalizados'}</p>
            <p class="mt-1 text-sm text-brand-textMuted">${sinPedidos ? 'Cuando pidas un envío lo vas a ver acá.' : 'Tus pedidos entregados y cancelados van a aparecer acá.'}</p>
          </div>`;
        return;
      }

      lista.innerHTML = pedidos.map(p => {
        const estado = estadoUI(p);
        return `
          <a href="${urlPedido(p.id_pedido)}"
            class="flex items-center gap-3 px-4 py-3.5 hover:bg-brand-surfaceLight active:bg-brand-surfaceHover transition-colors">
            <span class="w-11 h-11 rounded-2xl bg-brand-surfaceLight flex items-center justify-center text-xl shrink-0" aria-hidden="true">${emojiPaquete(p.tipo_paquete)}</span>
            <span class="flex-1 min-w-0">
              <span class="block text-sm font-bold text-brand-dark truncate">${escaparHtml(p.inform_pedido || 'Envío')}</span>
              <span class="block text-xs text-brand-textMuted truncate">${formatearFechaPedido(p.fecha_pedido)} · #${escaparHtml(p.id_pedido)}</span>
            </span>
            <span class="text-right shrink-0">
              <span class="block text-sm font-extrabold text-brand-dark">${formatearPesos(p.coste_pedido)}</span>
              <span class="inline-flex mt-0.5 px-2 py-0.5 rounded-full text-[11px] font-bold ${estado.clases}">${escaparHtml(estado.texto)}</span>
            </span>
          </a>`;
      }).join('');
    }

    function renderErrorHistorial() {
      const lista = document.getElementById('historialList');
      lista.innerHTML = `
        <div class="px-6 py-10 text-center">
          <span class="text-4xl" aria-hidden="true">⚠️</span>
          <p class="mt-3 font-bold">No pudimos cargar tus pedidos</p>
          <p class="mt-1 text-sm text-brand-textMuted">Revisá tu conexión e intentá de nuevo.</p>
          <button type="button" data-reintentar
            class="mt-4 h-11 px-5 rounded-xl bg-brand-surfaceLight border border-brand-border font-bold text-sm">Reintentar</button>
        </div>`;
      lista.querySelector('[data-reintentar]').addEventListener('click', () => cargarPedidos());
    }

    function urlPedido(idPedido) {
      return `${PAGINAS.pedidoActivo}?id_pedido=${encodeURIComponent(idPedido)}`;
    }
  </script>
</body>

</html>
